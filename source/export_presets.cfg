html/head_include="<style>#rot{position:fixed;inset:0;z-index:99;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:#0b0d14;color:#ffe9b0;font:700 22px sans-serif;text-align:center;padding:24px}#rot .ph{width:70px;height:110px;border:5px solid #ffe9b0;border-radius:12px;animation:rr 1.6s ease-in-out infinite}@keyframes rr{0%,30%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}@media (orientation:portrait) and (pointer:coarse){#rot{display:flex}}</style><script>(function(){function go(){try{var el=document.documentElement;if(!document.fullscreenElement&&el.requestFullscreen){el.requestFullscreen({navigationUI:'hide'}).then(function(){if(screen.orientation&&screen.orientation.lock){return screen.orientation.lock('landscape')}}).catch(function(){})}else if(screen.orientation&&screen.orientation.lock){screen.orientation.lock('landscape').catch(function(){})}}catch(e){}}document.addEventListener('touchend',go,{passive:true});document.addEventListener('click',function(){if(matchMedia('(pointer:coarse)').matches)go()});document.addEventListener('DOMContentLoaded',function(){var d=document.createElement('div');d.id='rot';d.innerHTML='<div class=\"ph\"></div><div>หมุนมือถือเป็นแนวนอน</div><div style=\"font-size:15px;opacity:.75\">แตะจอ 1 ครั้งเพื่อเต็มจอแนวนอน</div>';d.addEventListener('touchend',go);document.body.appendChild(d)})})();</script>"
