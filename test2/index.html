<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Test 2</title>
<style>body{margin:0;background:#111;color:#fff;font:18px sans-serif}#i{position:fixed;left:10px;top:10px;white-space:pre-wrap;z-index:2;text-shadow:0 0 4px #000}</style></head><body><div id="i">กำลังตรวจ...</div>
<script src="three.min.js"></script><script>
var out=[];function L(s){out.push(s);document.getElementById('i').textContent=out.join('\n')}
try{var c=document.createElement('canvas');var g2=c.getContext('webgl2');L('WebGL2: '+(g2?'มี':'ไม่มี'));
if(g2){var d=g2.getExtension('WEBGL_debug_renderer_info');L('การ์ดจอ: '+(d?g2.getParameter(d.UNMASKED_RENDERER_WEBGL):g2.getParameter(g2.RENDERER)));L('Max texture: '+g2.getParameter(g2.MAX_TEXTURE_SIZE))}
var c1=document.createElement('canvas');L('WebGL1: '+(c1.getContext('webgl')?'มี':'ไม่มี'));}catch(e){L('ตรวจไม่ได้: '+e)}
L(navigator.userAgent);
try{var r=new THREE.WebGLRenderer({antialias:false});r.setSize(innerWidth,innerHeight);document.body.appendChild(r.domElement);
r.domElement.addEventListener('webglcontextlost',function(){L('!!! three.js ก็จอดำ (context lost)')});
var s=new THREE.Scene(),cam=new THREE.PerspectiveCamera(50,innerWidth/innerHeight,.1,100);cam.position.z=4;
var m=new THREE.Mesh(new THREE.BoxGeometry(1.4,1.4,1.4),new THREE.MeshStandardMaterial({color:0x33aaff}));s.add(m);s.add(new THREE.DirectionalLight(0xffffff,1.2));s.add(new THREE.AmbientLight(0x666666));
var t0=performance.now(),n=0;(function f(){requestAnimationFrame(f);m.rotation.x+=.01;m.rotation.y+=.02;r.render(s,cam);n++;if(n==120)L('three.js OK ('+Math.round(120000/(performance.now()-t0))+' FPS)')})();}catch(e){L('three.js error: '+e)}
</script></body></html>
